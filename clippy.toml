disallowed-methods = [
  # general Rust. Result::unwrap is not banned: serde_json's json! macro expands to it.
  { path = "std::option::Option::unwrap", reason = "Panic only on a bug: use .expect(\"why this cannot be None\"), or return the absence as a Result." },
  # general Rust
  { path = "std::env::temp_dir", reason = "Use tempfile, such as tempfile::tempdir(), so a guard removes the folder. In xtask tests, use test_support::temporary_directory()." },
]


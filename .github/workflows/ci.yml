name: CI

on:
  push:
    branches: [main]
  # Every base branch, so pull requests stacked on another pull request run CI too.
  pull_request:
  schedule:
    # Weekly, so new security advisories fail cargo-deny without a code change.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  # The event is part of the group, so a push to main does not cancel the scheduled audit.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny,cargo-shear,typos,taplo
      - run: cargo xtask check tidy

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GPUI system packages (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-gpui-system-packages
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - run: cargo xtask check build

  end-to-end:
    name: End to end (Linux)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # Ubuntu 24.04's Xwayland aborts on the first xdotool input under headless Weston, so the job
    # runs the same current Weston and Xwayland as local runs.
    container:
      image: archlinux@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
    timeout-minutes: 30
    steps:
      - name: Install the build tools and the sandbox stack
        run: |
          pacman -Syu --noconfirm --needed \
            alsa-lib \
            base-devel \
            curl \
            fontconfig \
            freetype2 \
            git \
            imagemagick \
            libxcb \
            libxkbcommon \
            libxkbcommon-x11 \
            openssl \
            pkgconf \
            rustup \
            ttf-dejavu \
            vulkan-icd-loader \
            vulkan-swrast \
            wayland \
            weston \
            xdotool \
            xorg-xwayland
          install -d -m 1777 /tmp/.X11-unix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - name: Install ruta
        run: cargo install --git https://github.com/sQVe/ruta --tag v0.2.1 --locked ruta
      - name: Run the sandbox end to end
        env:
          GREPPA_E2E_ARTIFACTS: ${{ runner.temp }}/sandbox-end-to-end
        run: cargo nextest run -p xtask --run-ignored only --test sandbox_end_to_end
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: sandbox-end-to-end
          path: |
            ${{ runner.temp }}/sandbox-end-to-end/
            .tau/judge/smoke-2/
          if-no-files-found: warn

  mutation:
    name: Mutation (changed)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GPUI system packages
        uses: ./.github/actions/install-gpui-system-packages
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Mutate the pull request's diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          cargo xtask mutation changed "$BASE_SHA" > mutation-report.json || status=$?
          cat mutation-report.json
          {
            echo "### Mutation testing"
            echo
            jq -r '"Status: \(.status), \(.survivors | length) survivors"' mutation-report.json
            jq -r '.survivors[] | "- `\(.file):\(.line)`: \(.original) -> \(.replacement)"' mutation-report.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

  mutation-audit:
    name: Mutation audit
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GPUI system packages
        uses: ./.github/actions/install-gpui-system-packages
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest
      - name: Mutate the whole workspace
        run: |
          status=0
          cargo mutants --workspace --test-tool nextest || status=$?
          echo "cargo-mutants exited with $status"
          case "$status" in
            0 | 2 | 3) ;;
            *) exit "$status" ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out
          if-no-files-found: warn
